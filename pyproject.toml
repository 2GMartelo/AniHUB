[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anihub"
version = "0.16.1"
description = "AniHUB: art browser, manga reader, Stable Diffusion frontend and media library"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.10",
    "httpx>=0.27",
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "pytoshop>=1.2",   # writes the layered PSD the VTube pipeline hands off to Krita/Photoshop/a Live2D rigger
    "six",             # pytoshop's own runtime dependency; missing from its declared metadata
    "pypresence>=4.3", # Discord Rich Presence, talks to a local running Discord client over its IPC socket
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anihub = "anihub.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anihub = ["data/*"]

[tool.pytest.ini_options]
markers = ["shipped_pack: the test uses the real picture pack that ships with the app"]
testpaths = ["tests"]
pythonpath = ["src"]
